<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ikuti Polanya</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#c9efff,#fff2d0);color:#17365d}.w{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:30px;padding:20px;text-align:center;box-shadow:0 9px 0 #83d1a6}h1{margin:0;color:#ed4b89;font-size:clamp(35px,7vw,58px)}.sub{font-size:19px;font-weight:800}.top{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px}.badge{background:#eaf8ff;padding:9px 15px;border-radius:15px;font-weight:900}.pattern{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;min-height:130px;background:#fff5ca;border-radius:25px;padding:15px;margin:18px auto;max-width:760px}.tile{width:88px;height:88px;background:white;border:4px solid #ffd365;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:0 4px 0 #d8ad44}.tile.q{border-style:dashed;border-color:#72bce7;background:#eefaff;color:#5caed7;font-size:43px;font-weight:900}.choices{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:18px}.choice{width:105px;height:90px;border:4px solid #e98cb0;border-radius:20px;background:#ffe4ee;font-size:50px;cursor:pointer;box-shadow:0 5px 0 #cf7898}.choice.wrong{animation:shake .3s;background:#ffdcdc}.choice.right{background:#dff7d7;border-color:#82cc76}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.msg{height:44px;font-size:25px;font-weight:900}.level{font-size:21px;font-weight:900}.btn{border:0;border-radius:17px;padding:12px 18px;font-size:18px;font-weight:900;background:#ffd65d;cursor:pointer;box-shadow:0 5px 0 #d9ae35}footer{text-align:center;font-weight:800;margin:20px}@media(max-width:550px){.tile{width:65px;height:65px;font-size:38px}.choice{width:82px;height:75px;font-size:40px}.pattern{gap:6px}}</style><style id="homeNavStyle">#homeNav{position:fixed;left:14px;bottom:14px;z-index:9999;background:#fff;border:3px solid #ef6b9d;border-radius:18px;padding:10px 14px;text-decoration:none;color:#c93672;font:800 15px Arial,sans-serif;box-shadow:0 4px 10px #0002}#homeNav:hover{transform:translateY(-2px)}</style></head><body><div class="w"><div class="card"><h1>🎨 Ikuti Polanya</h1><div class="sub">Perhatikan urutannya. Pilih gambar yang tepat untuk melanjutkan pola!</div><div class="top"><div class="badge" id="round"></div><div class="badge" id="stars">⭐ 0</div></div><div class="level" id="level"></div><div class="pattern" id="pattern"></div><div class="choices" id="choices"></div><div class="msg" id="msg"></div><button class="btn" onclick="newRound()">Pola Berikutnya ➜</button></div><footer>Belajar Bersama Bu Kalsum<br><small>Pola & penalaran • Belajar hari ini, hebat setiap hari.</small></footer></div><script>
const sets=[['🔴','🔵','🟡','🟢'],['🍎','🍌','🍊','🍓'],['⭐','❤️','🌸','☁️'],['🐟','🐥','🐸','🦋'],['🚗','🚌','🚲','🚂']];let r=0,score=0,answer='',locked=false;const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function newRound(){r++;locked=false;msg.textContent='';let s=sets[Math.floor(Math.random()*sets.length)],type=r<=3?'AB':r<=6?'AAB':'ABC',seq=[];if(type==='AB'){for(let i=0;i<6;i++)seq.push(s[i%2]);answer=s[0]}else if(type==='AAB'){let base=[s[0],s[0],s[1]];for(let i=0;i<6;i++)seq.push(base[i%3]);answer=s[0]}else{let base=[s[0],s[1],s[2]];for(let i=0;i<6;i++)seq.push(base[i%3]);answer=s[0]}pattern.innerHTML='';seq.forEach(x=>{let d=document.createElement('div');d.className='tile';d.textContent=x;pattern.appendChild(d)});let q=document.createElement('div');q.className='tile q';q.textContent='?';q.id='q';pattern.appendChild(q);let opts=shuffle([answer,...s.filter(x=>x!==answer).slice(0,3)]);choices.innerHTML='';opts.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>pick(b,x);choices.appendChild(b)});round.textContent='Soal '+r;stars.textContent='⭐ '+score;level.textContent='Level '+(r<=3?1:r<=6?2:3)+' • Pola '+type}
function pick(b,x){if(locked)return;if(x===answer){locked=true;b.classList.add('right');q.textContent=x;q.classList.remove('q');score++;stars.textContent='⭐ '+score;msg.textContent='Benar! Polanya lengkap! 🎉';setTimeout(newRound,1200)}else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');msg.textContent='Belum tepat. Lihat polanya lagi 👀'}}
newRound();
</script><a id="homeNav" href="index.html">🏠 Taman Bermain</a></body></html>
