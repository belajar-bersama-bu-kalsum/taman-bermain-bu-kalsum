<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Susun Kata — Belajar Bersama Bu Kalsum</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#c9efff,#fff7d9);color:#17365d;min-height:100vh}
.wrap{max-width:820px;margin:auto;padding:20px}
.card{background:white;border-radius:30px;padding:22px;text-align:center;box-shadow:0 9px 0 #82d1a7}
h1{margin:0;color:#ef4d8c;font-size:clamp(36px,7vw,60px)}
.sub{font-size:20px;font-weight:800;margin:6px 0 20px}
.picture{font-size:100px;line-height:1.15;margin:8px}
.hint{font-size:21px;font-weight:800;margin:8px}
.answer{min-height:76px;margin:18px auto;padding:12px;border:4px dashed #75c7f3;border-radius:22px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:520px}
.piece,.chosen{border:0;border-radius:18px;padding:14px 24px;font-size:31px;font-weight:900}
.piece{background:#fff0f6;color:#d93678;box-shadow:0 5px 0 #efb0ca;cursor:pointer}
.chosen{background:#eaf8ff;color:#1762a7}
.pieces{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:18px}
.message{min-height:42px;font-size:27px;font-weight:900;margin:12px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.action{border:0;border-radius:18px;padding:13px 20px;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.13)}
.reset{background:#ffd55d}.next{background:#77d7a0}.sound{background:#83ceff}
.progress{font-weight:800;margin-top:18px}
footer{text-align:center;font-weight:800;margin:25px}
</style>
<style id="homeNavStyle">#homeNav{position:fixed;left:14px;bottom:14px;z-index:9999;background:#fff;border:3px solid #ef6b9d;border-radius:18px;padding:10px 14px;text-decoration:none;color:#c93672;font:800 15px Arial,sans-serif;box-shadow:0 4px 10px #0002}#homeNav:hover{transform:translateY(-2px)}</style></head>
<body>
<div class="wrap">
<div class="card">
<h1>Susun Kata</h1>
<div class="sub">Lihat gambar, lalu susun suku katanya!</div>
<div class="picture" id="picture">👁️</div>
<div class="hint" id="hint">Kata apakah ini?</div>
<div class="answer" id="answer"><span style="opacity:.45;font-weight:800">Tekan suku kata di bawah</span></div>
<div class="pieces" id="pieces"></div>
<div class="message" id="message"></div>
<div class="actions">
<button class="action reset" onclick="resetRound()">↩ Ulangi</button>
<button class="action sound" onclick="speakWord()">🔊 Dengarkan</button>
<button class="action next" onclick="nextWord()">Berikutnya ➜</button>
</div>
<div class="progress" id="progress"></div>
</div>
<footer>Belajar Bersama Bu Kalsum<br><small>Belajar hari ini, hebat setiap hari.</small></footer>
</div>
<script>
const words=[
 {word:'mata', parts:['ma','ta'], icon:'👁️'},
 {word:'bola', parts:['bo','la'], icon:'⚽'},
 {word:'susu', parts:['su','su'], icon:'🥛'},
 {word:'batu', parts:['ba','tu'], icon:'🪨'},
 {word:'kaki', parts:['ka','ki'], icon:'🦶'},
 {word:'pita', parts:['pi','ta'], icon:'🎀'},
 {word:'nasi', parts:['na','si'], icon:'🍚'},
 {word:'buku', parts:['bu','ku'], icon:'📖'}
];
let idx=0, selected=[];

function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function render(){
 const w=words[idx];
 document.getElementById('picture').textContent=w.icon;
 document.getElementById('message').textContent='';
 selected=[];
 drawAnswer();
 const p=document.getElementById('pieces'); p.innerHTML='';
 shuffled(w.parts.map((x,i)=>({x,i}))).forEach(obj=>{
   const b=document.createElement('button');
   b.className='piece'; b.textContent=obj.x;
   b.onclick=()=>{ selected.push(obj.x); b.disabled=true; b.style.opacity=.35; drawAnswer(); check(); };
   p.appendChild(b);
 });
 document.getElementById('progress').textContent=`Kata ${idx+1} dari ${words.length}`;
}
function drawAnswer(){
 const a=document.getElementById('answer'); a.innerHTML='';
 if(!selected.length){a.innerHTML='<span style="opacity:.45;font-weight:800">Tekan suku kata di bawah</span>';return}
 selected.forEach(x=>{const s=document.createElement('span');s.className='chosen';s.textContent=x;a.appendChild(s)})
}
function check(){
 const w=words[idx];
 if(selected.length===w.parts.length){
   if(selected.join('')===w.word){
     document.getElementById('message').textContent='Hebat! 🎉 '+w.word;
     speakWord();
   }else{
     document.getElementById('message').textContent='Coba lagi, ya! 😊';
     setTimeout(resetRound,900);
   }
 }
}
function resetRound(){render()}
function nextWord(){idx=(idx+1)%words.length;render()}
function speakWord(){
 const u=new SpeechSynthesisUtterance(words[idx].word);
 u.lang='id-ID';u.rate=.65;speechSynthesis.cancel();speechSynthesis.speak(u);
}
render();
</script>
<a id="homeNav" href="index.html">🏠 Taman Bermain</a></body>
</html>
