<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sortir Keranjang</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#c9efff,#fff5d6);color:#17365d}.w{max-width:900px;margin:auto;padding:18px}.c{background:white;border-radius:30px;padding:20px;text-align:center;box-shadow:0 9px 0 #83d1a6}h1{margin:0;color:#ed4b89;font-size:clamp(34px,7vw,58px)}.sub{font-size:19px;font-weight:800}.info{font-weight:900;margin:10px}.item{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:160px;height:140px;border-radius:25px;background:#fff2c7;border:4px solid #ffd36a;cursor:grab;touch-action:none;user-select:none;box-shadow:0 6px 0 #d9ae48;margin:12px}.emoji{font-size:62px}.name{font-size:22px;font-weight:900}.bins{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;margin:18px}.bin{width:260px;height:180px;border:5px dashed #72bce7;border-radius:28px;background:#eaf8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:25px}.bin span{font-size:65px}.bin.good{background:#dcf7d3;border-color:#83ce76}.bin.bad{animation:sh .35s;background:#ffe1e1}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.msg{height:42px;font-size:25px;font-weight:900}.btn{border:0;border-radius:17px;padding:12px 18px;font-size:18px;font-weight:900;background:#ffd65d;cursor:pointer;box-shadow:0 5px 0 #d9ae35}footer{text-align:center;font-weight:800;margin:22px}</style><style id="homeNavStyle">#homeNav{position:fixed;left:14px;bottom:14px;z-index:9999;background:#fff;border:3px solid #ef6b9d;border-radius:18px;padding:10px 14px;text-decoration:none;color:#c93672;font:800 15px Arial,sans-serif;box-shadow:0 4px 10px #0002}#homeNav:hover{transform:translateY(-2px)}</style></head><body><div class="w"><div class="c"><h1>🧺 Sortir Keranjang</h1><div class="sub">Seret benda ke keranjang yang tepat!</div><div class="info" id="info"></div><div class="item" id="item"><div class="emoji" id="emoji"></div><div class="name" id="name"></div></div><div class="bins"><div class="bin" data-type="fruit"><span>🍎</span>BUAH</div><div class="bin" data-type="not"><span>📦</span>BUKAN BUAH</div></div><div class="msg" id="msg"></div><button class="btn" onclick="restart()">↻ Mulai Lagi</button></div><footer>Belajar Bersama Bu Kalsum<br><small>Mengelompokkan benda • Belajar hari ini, hebat setiap hari.</small></footer></div><script>
const data=[['🍎','apel','fruit'],['🍌','pisang','fruit'],['🍊','jeruk','fruit'],['🍍','nanas','fruit'],['🍉','semangka','fruit'],['📖','buku','not'],['✏️','pensil','not'],['⚽','bola','not'],['🧸','boneka','not'],['👟','sepatu','not']];let list=[],i=0,stars=0,drag=null;const bins=[...document.querySelectorAll('.bin')],item=document.getElementById('item');const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function show(){if(i>=list.length){emoji.textContent='🏆';name.textContent='Selesai!';msg.textContent='Hebat! Semua benda sudah disortir! 🎉';item.style.cursor='default';return}let x=list[i];emoji.textContent=x[0];name.textContent=x[1];item.dataset.type=x[2];msg.textContent='';bins.forEach(b=>b.classList.remove('good','bad'));update()}
item.draggable=true;item.addEventListener('dragstart',()=>drag=item);item.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')drag=item});item.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse'){let el=document.elementFromPoint(e.clientX,e.clientY);let b=el?.closest('.bin');if(b)drop(b)}});
bins.forEach(b=>{b.addEventListener('dragover',e=>e.preventDefault());b.addEventListener('drop',e=>{e.preventDefault();drop(b)})});
function drop(b){if(i>=list.length)return;if(b.dataset.type===item.dataset.type){b.classList.add('good');stars++;msg.textContent='Benar! Masuk keranjang! 🌟';i++;setTimeout(show,600)}else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');msg.textContent='Ups, bukan keranjang itu 😊'}update()}
function update(){info.textContent='Benda '+Math.min(i+1,list.length)+' dari '+list.length+'   ⭐ '+stars}
function restart(){list=shuffle(data);i=0;stars=0;item.style.cursor='grab';show()}restart();
</script><a id="homeNav" href="index.html">🏠 Taman Bermain</a></body></html>
