<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puzzle Gambar</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#c9efff,#fff4d3);color:#17365d}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:30px;padding:20px;text-align:center;box-shadow:0 9px 0 #83d1a6}h1{margin:0;color:#ed4b89;font-size:clamp(35px,7vw,58px)}.sub{font-size:19px;font-weight:800}.info{font-weight:900;margin:10px}.game{display:flex;justify-content:center;align-items:center;gap:35px;flex-wrap:wrap;margin:18px}.board{display:grid;grid-template-columns:repeat(3,110px);grid-template-rows:repeat(2,110px);border:6px solid #70bfe7;border-radius:18px;overflow:hidden;background:#eaf8ff}.slot{width:110px;height:110px;border:2px dashed #9bcfe7;display:flex;align-items:center;justify-content:center;color:#9bb4c1;font-size:28px;font-weight:900}.tray{width:360px;min-height:250px;border-radius:24px;background:#fff3c9;padding:12px;display:flex;gap:10px;justify-content:center;align-content:center;flex-wrap:wrap}.piece{width:105px;height:105px;border-radius:13px;border:3px solid white;box-shadow:0 4px 0 #c8a64b;cursor:grab;touch-action:none;background-size:330px 220px;background-repeat:no-repeat}.slot .piece{width:110px;height:110px;border:0;border-radius:0;box-shadow:none}.msg{height:42px;font-size:25px;font-weight:900}.name{font-size:36px;font-weight:900;color:#e34480;min-height:44px}.btn{border:0;border-radius:17px;padding:12px 18px;font-size:18px;font-weight:900;background:#ffd65d;cursor:pointer;box-shadow:0 5px 0 #d9ae35}footer{text-align:center;font-weight:800;margin:20px}@media(max-width:450px){.board{grid-template-columns:repeat(3,90px);grid-template-rows:repeat(2,90px)}.slot,.slot .piece{width:90px;height:90px}.piece{width:85px;height:85px;background-size:270px 180px}.tray{width:290px}}</style><style id="homeNavStyle">#homeNav{position:fixed;left:14px;bottom:14px;z-index:9999;background:#fff;border:3px solid #ef6b9d;border-radius:18px;padding:10px 14px;text-decoration:none;color:#c93672;font:800 15px Arial,sans-serif;box-shadow:0 4px 10px #0002}#homeNav:hover{transform:translateY(-2px)}</style></head><body><div class="wrap"><div class="card"><h1>🧩 Puzzle Gambar</h1><div class="sub">Susun 6 potongan sampai menjadi satu gambar!</div><div class="info" id="info"></div><div class="game"><div class="board" id="board"></div><div class="tray" id="tray"></div></div><div class="name" id="name"></div><div class="msg" id="msg"></div><button class="btn" onclick="newPuzzle()">🎲 Puzzle Berikutnya</button></div><footer>Belajar Bersama Bu Kalsum<br><small>Pengamatan & pemecahan masalah • Belajar hari ini, hebat setiap hari.</small></footer></div><script>
const pictures=[
{name:'apel',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="330" height="220"><rect width="100%" height="100%" fill="#fff7cf"/><ellipse cx="165" cy="130" rx="75" ry="65" fill="#ef4d5b"/><ellipse cx="135" cy="125" rx="48" ry="58" fill="#f45b67"/><ellipse cx="195" cy="125" rx="48" ry="58" fill="#e94250"/><path d="M165 72 Q160 45 176 29" stroke="#71482e" stroke-width="12" fill="none"/><ellipse cx="196" cy="46" rx="31" ry="14" fill="#67b85c" transform="rotate(-25 196 46)"/><circle cx="130" cy="105" r="10" fill="#ff9ca4"/></svg>`},
{name:'nanas',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="330" height="220"><rect width="100%" height="100%" fill="#e9fbff"/><path d="M165 78 L130 25 157 55 165 13 174 56 205 25 183 80" fill="#54ad62"/><ellipse cx="165" cy="137" rx="61" ry="72" fill="#f4c846"/><g stroke="#c79428" stroke-width="5"><path d="M120 105l90 65M112 135l75 54M210 105l-90 65M218 135l-75 54"/></g></svg>`},
{name:'timun',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="330" height="220"><rect width="100%" height="100%" fill="#fff4dc"/><rect x="65" y="85" width="205" height="70" rx="35" fill="#54b96b" transform="rotate(-12 165 120)"/><path d="M92 125q75-35 150-22" stroke="#88d88f" stroke-width="8" fill="none"/><g fill="#d9ef8a"><circle cx="120" cy="112" r="4"/><circle cx="155" cy="125" r="4"/><circle cx="195" cy="105" r="4"/><circle cx="225" cy="125" r="4"/></g></svg>`},
{name:'obeng',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="330" height="220"><rect width="100%" height="100%" fill="#eef8ff"/><g transform="rotate(-25 165 110)"><rect x="75" y="95" width="140" height="25" rx="8" fill="#aeb8c3"/><path d="M70 96h18v23H70l-18-11z" fill="#687784"/><rect x="205" y="78" width="75" height="60" rx="24" fill="#ef5350"/><rect x="218" y="86" width="10" height="44" rx="5" fill="#ffaaa8"/><rect x="242" y="86" width="10" height="44" rx="5" fill="#c93f3d"/></g></svg>`},
{name:'udang',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="330" height="220"><rect width="100%" height="100%" fill="#eafcff"/><path d="M235 75c-65-42-140 1-133 60 5 45 58 57 92 32-47 4-63-33-43-58 20-25 58-12 58 14 0 16-12 26-25 27 35 10 73-15 72-52z" fill="#f58b7d"/><circle cx="226" cy="88" r="7" fill="#263238"/><path d="M245 84q38-32 48-12M248 91q40-10 49 8" stroke="#e26e64" stroke-width="4" fill="none"/><path d="M103 134l-38 25 15-37-30-18 49-3" fill="#f58b7d"/><g stroke="#d8645c" stroke-width="4"><path d="M128 92l16 18M111 108l20 15M107 130l22 7"/></g></svg>`}
];
let pi=-1,drag=null,placed=0,current;const enc=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
function newPuzzle(){pi=(pi+1)%pictures.length;current=pictures[pi];placed=0;name.textContent='';msg.textContent='';board.innerHTML='';tray.innerHTML='';let order=[0,1,2,3,4,5].sort(()=>Math.random()-.5);for(let i=0;i<6;i++){let sl=document.createElement('div');sl.className='slot';sl.dataset.pos=i;sl.textContent=i+1;sl.addEventListener('dragover',e=>e.preventDefault());sl.addEventListener('drop',e=>{e.preventDefault();place(sl)});sl.addEventListener('pointerup',e=>{if(drag&&e.pointerType!=='mouse')place(sl)});board.appendChild(sl)}order.forEach(pos=>{let p=document.createElement('div');p.className='piece';p.draggable=true;p.dataset.pos=pos;p.style.backgroundImage=`url("${enc(current.svg)}")`;let col=pos%3,row=Math.floor(pos/3);p.style.backgroundPosition=`${-col*110}px ${-row*110}px`;p.addEventListener('dragstart',()=>drag=p);p.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')drag=p});tray.appendChild(p)});info.textContent='Puzzle '+(pi+1)+' dari '+pictures.length}
function place(sl){if(!drag||sl.querySelector('.piece'))return;if(+drag.dataset.pos===+sl.dataset.pos){sl.textContent='';sl.appendChild(drag);drag=null;placed++;msg.textContent='Pas! 🌟';if(placed===6){name.textContent=current.name.toUpperCase();msg.textContent='Hebat! Gambarnya sudah lengkap! 🎉'}}else{msg.textContent='Belum pas. Coba tempat lain 😊';sl.animate([{transform:'rotate(-3deg)'},{transform:'rotate(3deg)'},{transform:'rotate(0)'}],{duration:250});drag=null}}
newPuzzle();
</script><a id="homeNav" href="index.html">🏠 Taman Bermain</a></body></html>
