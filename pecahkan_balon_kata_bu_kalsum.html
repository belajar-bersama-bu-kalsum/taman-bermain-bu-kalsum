<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pecahkan Balon Kata</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#c8efff,#fff4d3);color:#17365d}.w{max-width:900px;margin:auto;padding:18px}.c{background:white;border-radius:30px;padding:20px;text-align:center;box-shadow:0 9px 0 #83d1a6}h1{margin:0;color:#ed4b89;font-size:clamp(34px,7vw,58px)}.sub{font-size:19px;font-weight:800}.target{display:inline-block;background:#fff0ae;border-radius:20px;padding:10px 20px;margin:10px;font-size:25px;font-weight:900}.target b{font-size:36px;color:#d93678}.info{font-weight:900}.game{position:relative;height:450px;border:4px solid #9ed9ef;border-radius:27px;overflow:hidden;background:linear-gradient(#dff6ff,#bcecff);margin-top:12px}.balloon{position:absolute;width:92px;height:112px;border-radius:50% 50% 47% 47%;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;cursor:pointer;box-shadow:inset -8px -9px rgba(0,0,0,.08);animation:rise linear infinite}.balloon:after{content:"";position:absolute;bottom:-45px;width:2px;height:48px;background:#777}.pop{animation:pop .28s forwards!important}@keyframes pop{to{transform:scale(1.7);opacity:0}}@keyframes rise{from{transform:translateY(500px)}to{transform:translateY(-160px)}}.msg{height:42px;font-size:25px;font-weight:900;margin:11px}.btn{border:0;border-radius:17px;padding:12px 18px;font-size:18px;font-weight:900;background:#ffd65d;cursor:pointer}footer{text-align:center;font-weight:800;margin:22px}</style><style id="homeNavStyle">#homeNav{position:fixed;left:14px;bottom:14px;z-index:9999;background:#fff;border:3px solid #ef6b9d;border-radius:18px;padding:10px 14px;text-decoration:none;color:#c93672;font:800 15px Arial,sans-serif;box-shadow:0 4px 10px #0002}#homeNav:hover{transform:translateY(-2px)}</style></head><body><div class="w"><div class="c">
<h1>🎈 Pecahkan Balon Kata!</h1><div class="sub">Pecahkan balon yang dimulai dengan huruf yang diminta.</div><div class="target">Cari kata berawalan <b id="letter">m</b></div><div class="info" id="info"></div><div class="game" id="game"></div><div class="msg" id="msg"></div><button class="btn" onclick="restart()">↻ Mulai Lagi</button></div><footer>Belajar Bersama Bu Kalsum<br><small>Literasi awal • Belajar hari ini, hebat setiap hari.</small></footer></div><script>
const data={m:['mata','meja','madu'],b:['bola','buku','batu'],t:['tali','tahu','topi'],s:['susu','sapu','sapi'],l:['lilin','labu','lebah'],k:['kaki','kue','kuda'],p:['pita','paku','padi'],n:['nasi','nanas','naga']};
const all=Object.values(data).flat(), colors=['#ffd0df','#cceeff','#ffe59a','#d8f2cf','#e8d9ff','#ffd6b8'];
let target='m',score=0,round=1,need=0,got=0;const game=document.getElementById('game');
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function newRound(){game.innerHTML='';msg.textContent='';target=Object.keys(data)[Math.floor(Math.random()*8)];letter.textContent=target;got=0;need=3;
let correct=shuffle(data[target]).slice(0,3), wrong=shuffle(all.filter(x=>x[0]!==target)).slice(0,5), words=shuffle([...correct,...wrong]);
words.forEach((word,i)=>{let b=document.createElement('div');b.className='balloon';b.textContent=word;b.style.background=colors[i%colors.length];b.style.left=(4+(i%4)*24)+'%';b.style.animationDuration=(5.5+Math.random()*3)+'s';b.style.animationDelay=(-Math.random()*5)+'s';b.onclick=()=>pick(b,word);game.appendChild(b)});update()}
function pick(b,word){if(b.classList.contains('pop'))return;if(word[0]===target){b.classList.add('pop');score++;got++;msg.textContent='Pop! Benar! 🎉';if(got===need)setTimeout(()=>{round++;newRound()},650)}else{score=Math.max(0,score-1);msg.textContent='Ups! Kata itu bukan huruf '+target+' 😊';b.style.animationDuration='2.5s'}update()}
function update(){info.textContent='⭐ '+score+'   •   Balon benar '+got+' dari '+need+'   •   Putaran '+round}
function restart(){score=0;round=1;newRound()}newRound();
</script><a id="homeNav" href="index.html">🏠 Taman Bermain</a></body></html>
