<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seberangi Sungai Angka</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#bfeaff,#fff5cf);color:#17365d}.wrap{max-width:920px;margin:auto;padding:18px}.card{background:#fff;border-radius:30px;padding:18px;text-align:center;box-shadow:0 9px 0 #84d0a6}h1{margin:0;color:#ed4b89;font-size:clamp(34px,7vw,58px)}.sub{font-size:19px;font-weight:800;margin:6px}.q{display:inline-block;background:#fff0a9;border-radius:20px;padding:9px 23px;font-size:clamp(32px,7vw,48px);font-weight:900}.info{font-weight:900;margin:8px}
.scene{position:relative;height:470px;border-radius:28px;overflow:hidden;border:4px solid #8ad1e9;background:linear-gradient(#bcecff 0 18%,#58c9ef 18% 100%)}
.bank{position:absolute;top:0;bottom:0;width:19%;background:linear-gradient(#72c85c,#a9df79);z-index:1}.left{left:0;border-radius:0 45% 45% 0}.right{right:0;border-radius:45% 0 0 45%}
.tree{position:absolute;font-size:55px;z-index:2}.t1{left:2%;top:40px}.t2{right:2%;top:55px}.flowers{position:absolute;font-size:28px;z-index:2}.f1{left:2%;bottom:15px}.f2{right:2%;bottom:20px}.flag{position:absolute;right:8%;top:155px;font-size:48px;z-index:3}
.wave{position:absolute;color:#dff8ff;font-size:35px;opacity:.8;z-index:0}.w1{left:24%;top:85px}.w2{left:48%;top:300px}.w3{right:23%;top:180px}.fish{position:absolute;font-size:30px;z-index:0}.fish1{left:35%;top:235px}.fish2{right:31%;top:355px}
.kid{position:absolute;left:7%;bottom:95px;font-size:58px;z-index:8;transition:left .6s ease,bottom .6s ease;filter:drop-shadow(0 4px 2px #537)}
.stone{position:absolute;width:110px;height:74px;border:0;border-radius:50%;background:linear-gradient(#eee4ce,#c9b99d);box-shadow:0 8px 0 #96866d;color:#17365d;font-size:30px;font-weight:900;cursor:pointer;z-index:5}.s1{left:21%;bottom:85px}.s2{left:42%;bottom:205px}.s3{left:63%;bottom:85px}.stone:active{transform:translateY(4px);box-shadow:0 4px 0 #96866d}
.msg{height:43px;font-size:25px;font-weight:900;margin:11px}.btn{border:0;border-radius:17px;padding:12px 18px;font-size:18px;font-weight:900;background:#ffd65d;box-shadow:0 5px 0 #d9ae35;cursor:pointer}.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}footer{text-align:center;font-weight:800;margin:22px}
@media(max-width:600px){.scene{height:420px}.stone{width:80px;height:61px}.s1{left:19%}.s2{left:41%}.s3{left:64%}.bank{width:17%}}
</style><style id="homeNavStyle">#homeNav{position:fixed;left:14px;bottom:14px;z-index:9999;background:#fff;border:3px solid #ef6b9d;border-radius:18px;padding:10px 14px;text-decoration:none;color:#c93672;font:800 15px Arial,sans-serif;box-shadow:0 4px 10px #0002}#homeNav:hover{transform:translateY(-2px)}</style></head><body><div class="wrap"><div class="card"><h1>🌊 Seberangi Sungai Angka</h1><div class="sub">Pilih batu jawaban yang benar agar bisa sampai ke seberang!</div><div class="q" id="q"></div><div class="info" id="info"></div>
<div class="scene"><div class="bank left"></div><div class="bank right"></div><div class="tree t1">🌳</div><div class="tree t2">🌴</div><div class="flowers f1">🌼🌷</div><div class="flowers f2">🌸🌻</div><div class="flag">🏁</div><div class="wave w1">≈≈≈</div><div class="wave w2">≈≈≈</div><div class="wave w3">≈≈≈</div><div class="fish fish1">🐟</div><div class="fish fish2">🐠</div><div class="kid" id="kid">🧒</div><button class="stone s1"></button><button class="stone s2"></button><button class="stone s3"></button></div>
<div class="msg" id="msg"></div><button class="btn" onclick="restart()">↻ Mulai Lagi</button></div><footer>Belajar Bersama Bu Kalsum<br><small>Pengurangan 1–20 • Belajar hari ini, hebat setiap hari.</small></footer></div>
<script>
let step=1,stars=0,a,b,ans,lock=false;const stones=[...document.querySelectorAll('.stone')],kid=document.getElementById('kid');const mix=a=>[...a].sort(()=>Math.random()-.5);
function problem(){a=6+Math.floor(Math.random()*15);b=1+Math.floor(Math.random()*a);ans=a-b;let x=new Set([ans]);while(x.size<3)x.add(Math.max(0,Math.min(20,ans+Math.floor(Math.random()*7)-3)));let o=mix([...x]);stones.forEach((s,i)=>{s.textContent=o[i];s.dataset.n=o[i];s.style.background='linear-gradient(#eee4ce,#c9b99d)';s.onclick=()=>pick(s)});q.textContent=a+' − '+b+' = ?';msg.textContent='';lock=false;update()}
function pick(s){if(lock)return;if(+s.dataset.n===ans){lock=true;stars++;s.style.background='#d9f7c9';msg.textContent='Benar! Lompat ke batu! 🌟';jump(step);setTimeout(()=>{if(step>=5)finish();else{step++;problem()}},800)}else{s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');msg.textContent='Ups! Batu ini bukan jawabannya. 😊'}update()}
function jump(n){let p=[['7%','95px'],['22%','85px'],['43%','205px'],['64%','85px'],['79%','105px']][Math.min(n,4)];kid.style.left=p[0];kid.style.bottom=p[1]}
function finish(){kid.style.left='86%';kid.style.bottom='100px';q.textContent='SAMPAI! 🎉';msg.textContent='Hebat! Kamu berhasil menyeberangi sungai! 🏆';stones.forEach(s=>s.onclick=null)}
function restart(){step=1;stars=0;kid.style.left='7%';kid.style.bottom='95px';problem()}function update(){info.textContent='Langkah '+step+' dari 5   ⭐ '+stars}restart();
</script><a id="homeNav" href="index.html">🏠 Taman Bermain</a></body></html>
