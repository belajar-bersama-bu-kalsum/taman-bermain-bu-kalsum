<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puzzle Suku Kata</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#c9efff,#fff5d5);color:#17365d}.w{max-width:850px;margin:auto;padding:18px}.c{background:#fff;border-radius:30px;padding:20px;text-align:center;box-shadow:0 9px 0 #83d1a6}h1{margin:0;color:#ed4b89;font-size:clamp(35px,7vw,58px)}.sub{font-size:19px;font-weight:800}.pic{font-size:92px;margin:8px}.slots{display:flex;justify-content:center;gap:15px;margin:15px}.slot{width:145px;height:85px;border:4px dashed #72bde7;border-radius:20px;background:#f0faff;display:flex;align-items:center;justify-content:center;font-size:35px;font-weight:900}.pieces{min-height:125px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;background:#fff7d8;border-radius:22px;padding:17px;margin:12px}.piece{padding:15px 25px;border-radius:18px;background:#ffcee0;border:3px solid #ef8bb1;font-size:31px;font-weight:900;cursor:grab;user-select:none;touch-action:none;box-shadow:0 5px 0 #dba0b6}.piece.dragging{opacity:.45}.slot.filled{border-style:solid;background:#dcf7d3;border-color:#86cf79}.msg{height:43px;font-size:25px;font-weight:900;margin:10px}.info{font-weight:900;margin:7px}.btn{border:0;border-radius:17px;padding:12px 18px;font-size:18px;font-weight:900;background:#ffd65d;cursor:pointer;box-shadow:0 5px 0 #d9ae35}.word{font-size:36px;font-weight:900;color:#df3e7d;min-height:44px}footer{text-align:center;font-weight:800;margin:22px}@media(max-width:500px){.slot{width:115px}.piece{padding:13px 19px}}</style><style id="homeNavStyle">#homeNav{position:fixed;left:14px;bottom:14px;z-index:9999;background:#fff;border:3px solid #ef6b9d;border-radius:18px;padding:10px 14px;text-decoration:none;color:#c93672;font:800 15px Arial,sans-serif;box-shadow:0 4px 10px #0002}#homeNav:hover{transform:translateY(-2px)}</style></head><body><div class="w"><div class="c"><h1>🧩 Puzzle Suku Kata</h1><div class="sub">Seret dua suku kata ke kotak yang tepat!</div><div class="info" id="info"></div><div class="pic" id="pic"></div><div class="slots"><div class="slot" data-slot="0">1</div><div class="slot" data-slot="1">2</div></div><div class="pieces" id="pieces"></div><div class="word" id="word"></div><div class="msg" id="msg"></div><button class="btn" onclick="next()">Soal Berikutnya ➜</button></div><footer>Belajar Bersama Bu Kalsum<br><small>Literasi awal • Belajar hari ini, hebat setiap hari.</small></footer></div><script>
const data=[
['bola','⚽','bo','la'],['mata','👁️','ma','ta'],['susu','🥛','su','su'],['batu','🪨','ba','tu'],['kaki','🦶','ka','ki'],['pita','🎀','pi','ta'],['nasi','🍚','na','si'],['buku','📖','bu','ku'],['nanas','🍍','na','nas'],['lebah','🐝','le','bah']
];
let idx=0,stars=0,placed=[null,null],drag=null;const slots=[...document.querySelectorAll('.slot')],shuffle=a=>[...a].sort(()=>Math.random()-.5);
function load(){placed=[null,null];word.textContent='';msg.textContent='';let d=data[idx];pic.textContent=d[1];slots.forEach((s,i)=>{s.textContent=i+1;s.classList.remove('filled')});let decoys=shuffle(data.flatMap(x=>[x[2],x[3]]).filter(x=>x!==d[2]&&x!==d[3])).slice(0,2);let arr=shuffle([{t:d[2],correct:0},{t:d[3],correct:1},...decoys.map(x=>({t:x,correct:-1}))]);pieces.innerHTML='';arr.forEach((x,i)=>{let p=document.createElement('div');p.className='piece';p.textContent=x.t;p.draggable=true;p.dataset.correct=x.correct;p.id='p'+i;p.addEventListener('dragstart',()=>{drag=p;p.classList.add('dragging')});p.addEventListener('dragend',()=>p.classList.remove('dragging'));p.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')drag=p});p.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse'){let el=document.elementFromPoint(e.clientX,e.clientY);let s=el?.closest('.slot');if(s)place(p,s)}});pieces.appendChild(p)});update()}
slots.forEach(s=>{s.addEventListener('dragover',e=>e.preventDefault());s.addEventListener('drop',e=>{e.preventDefault();if(drag)place(drag,s)})});
function place(p,s){let si=+s.dataset.slot;if(placed[si])return;if(+p.dataset.correct===si){placed[si]=p.textContent;s.textContent=p.textContent;s.classList.add('filled');p.style.visibility='hidden';msg.textContent='Pas! 🌟';check()}else{msg.textContent='Belum pas. Coba kotak lain 😊';p.animate([{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:250})}}
function check(){if(placed[0]&&placed[1]){let d=data[idx];word.textContent=placed[0]+' + '+placed[1]+' = '+d[0];msg.textContent='Hebat! Puzzle selesai! 🎉';stars++;update()}}
function next(){idx=(idx+1)%data.length;load()}function update(){info.textContent='Kata '+(idx+1)+' dari '+data.length+'   ⭐ '+stars}load();
</script><a id="homeNav" href="index.html">🏠 Taman Bermain</a></body></html>
