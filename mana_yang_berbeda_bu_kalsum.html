<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mana yang Berbeda?</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#c9efff,#fff3d1);color:#17365d}.w{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border-radius:30px;padding:20px;text-align:center;box-shadow:0 9px 0 #83d1a6}h1{margin:0;color:#ed4b89;font-size:clamp(34px,7vw,58px)}.sub{font-size:19px;font-weight:800}.top{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px}.badge{background:#eaf8ff;padding:9px 15px;border-radius:15px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:560px;margin:20px auto}.item{height:135px;border:4px solid #ffd36a;border-radius:23px;background:#fff4c9;font-size:67px;cursor:pointer;box-shadow:0 6px 0 #d8ae44;transition:.15s}.item:hover{transform:translateY(-2px)}.item.wrong{animation:shake .3s;background:#ffe0e0}.item.right{background:#dff7d7;border-color:#82cc76;transform:scale(1.06)}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.msg{height:45px;font-size:25px;font-weight:900}.level{font-size:21px;font-weight:900;margin:8px}.btn{border:0;border-radius:17px;padding:12px 18px;font-size:18px;font-weight:900;background:#ffd65d;cursor:pointer;box-shadow:0 5px 0 #d9ae35}footer{text-align:center;font-weight:800;margin:20px}@media(max-width:500px){.grid{gap:9px}.item{height:100px;font-size:52px}}</style><style id="homeNavStyle">#homeNav{position:fixed;left:14px;bottom:14px;z-index:9999;background:#fff;border:3px solid #ef6b9d;border-radius:18px;padding:10px 14px;text-decoration:none;color:#c93672;font:800 15px Arial,sans-serif;box-shadow:0 4px 10px #0002}#homeNav:hover{transform:translateY(-2px)}</style></head><body><div class="w"><div class="card"><h1>🔍 Mana yang Berbeda?</h1><div class="sub">Perhatikan baik-baik. Temukan satu gambar yang berbeda!</div><div class="top"><div class="badge" id="round"></div><div class="badge" id="stars">⭐ 0</div></div><div class="level" id="level"></div><div class="grid" id="grid"></div><div class="msg" id="msg"></div><button class="btn" onclick="makeRound()">Soal Berikutnya ➜</button></div><footer>Belajar Bersama Bu Kalsum<br><small>Konsentrasi & pengamatan • Belajar hari ini, hebat setiap hari.</small></footer></div><script>
const pairs=[['🍎','🍊'],['🍌','🌽'],['🐟','🐠'],['🌸','🌼'],['⭐','🌟'],['⚽','🏀'],['📕','📘'],['🐥','🐤'],['🍓','🍒'],['🚗','🚕'],['😊','🙂'],['❤️','💜']];let r=0,score=0,locked=false;
function makeRound(){r++;locked=false;msg.textContent='';let p=pairs[Math.floor(Math.random()*pairs.length)],count=r<4?6:9,odd=Math.floor(Math.random()*count);grid.innerHTML='';grid.style.gridTemplateColumns='repeat(3,1fr)';for(let i=0;i<count;i++){let b=document.createElement('button');b.className='item';b.textContent=i===odd?p[1]:p[0];b.dataset.odd=i===odd?'1':'0';b.onclick=()=>choose(b);grid.appendChild(b)}round.textContent='Soal '+r;stars.textContent='⭐ '+score;level.textContent=r<4?'Level 1 • 6 gambar':'Level 2 • 9 gambar'}
function choose(b){if(locked)return;if(b.dataset.odd==='1'){locked=true;b.classList.add('right');score++;stars.textContent='⭐ '+score;msg.textContent='Ketemu! Hebat sekali! 🎉';setTimeout(makeRound,1100)}else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');msg.textContent='Belum. Perhatikan lagi 👀'}}
makeRound();
</script><a id="homeNav" href="index.html">🏠 Taman Bermain</a></body></html>
