<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toko Buah Ceria</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#c9efff,#fff1c7);color:#17365d}.w{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:30px;padding:18px;text-align:center;box-shadow:0 9px 0 #82cfa0}h1{margin:0;color:#ed4b89;font-size:clamp(34px,7vw,58px)}.sub{font-size:18px;font-weight:800}.top{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px}.badge{padding:9px 15px;border-radius:16px;background:#e9f8ff;font-weight:900}.order{max-width:500px;margin:12px auto;background:#fff1b8;border:4px solid #ffd45f;border-radius:22px;padding:12px;font-size:25px;font-weight:900}.shop{display:flex;gap:20px;justify-content:center;align-items:stretch;flex-wrap:wrap}.shelf,.basketBox{width:390px;border-radius:25px;padding:14px}.shelf{background:#e8f8dc;border:5px solid #8ccf72}.basketBox{background:#ffe6ef;border:5px solid #ee9abc}.fruitTitle{font-size:21px;font-weight:900;margin-bottom:8px}.fruits{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:185px}.fruit{font-size:46px;width:65px;height:65px;border:0;background:white;border-radius:17px;cursor:pointer;box-shadow:0 4px 0 #c8d5c0;touch-action:none}.basket{min-height:185px;border:4px dashed #d4779b;border-radius:20px;background:#fff9fb;padding:10px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:5px}.basket .fruit{box-shadow:none;background:#fff3f7}.count{font-size:25px;font-weight:900;margin:8px}.msg{height:43px;font-size:24px;font-weight:900;margin:10px}.btn{border:0;border-radius:17px;padding:12px 18px;font-size:18px;font-weight:900;cursor:pointer;margin:4px;box-shadow:0 5px 0 rgba(0,0,0,.18)}.pay{background:#7dd79b}.clear{background:#ffd466}.next{background:#8ed3f4}footer{text-align:center;font-weight:800;margin:20px}@media(max-width:500px){.shelf,.basketBox{width:100%}.fruit{font-size:39px;width:57px;height:57px}}</style><style id="homeNavStyle">#homeNav{position:fixed;left:14px;bottom:14px;z-index:9999;background:#fff;border:3px solid #ef6b9d;border-radius:18px;padding:10px 14px;text-decoration:none;color:#c93672;font:800 15px Arial,sans-serif;box-shadow:0 4px 10px #0002}#homeNav:hover{transform:translateY(-2px)}</style></head><body><div class="w"><div class="card"><h1>🛒 Toko Buah Ceria</h1><div class="sub">Baca pesanan, lalu masukkan buah dengan jumlah yang tepat!</div><div class="top"><div class="badge" id="round"></div><div class="badge" id="stars">⭐ 0</div></div><div class="order" id="order"></div><div class="shop"><div class="shelf"><div class="fruitTitle">🏪 Rak Buah</div><div class="fruits" id="fruits"></div></div><div class="basketBox"><div class="fruitTitle">🧺 Keranjang Belanja</div><div class="basket" id="basket"></div><div class="count" id="count">Jumlah: 0</div></div></div><div class="msg" id="msg"></div><button class="btn clear" onclick="clearBasket()">↩ Kosongkan</button><button class="btn pay" onclick="check()">💰 Bayar</button><button class="btn next" onclick="newOrder()">Pesanan Baru ➜</button></div><footer>Belajar Bersama Bu Kalsum<br><small>Berhitung 1–10 • Belajar hari ini, hebat setiap hari.</small></footer></div><script>
const kinds=[['🍎','apel'],['🍊','jeruk'],['🍌','pisang'],['🍓','stroberi'],['🍍','nanas']];let target=0,current=null,chosen=0,score=0,n=0,done=false;
function newOrder(){n++;done=false;chosen=0;basket.innerHTML='';msg.textContent='';current=kinds[Math.floor(Math.random()*kinds.length)];target=1+Math.floor(Math.random()*10);order.innerHTML='Pesanan: <b>'+target+' '+current[1]+'</b> '+current[0];fruits.innerHTML='';for(let i=0;i<12;i++){let b=document.createElement('button');b.className='fruit';b.textContent=current[0];b.title='Masukkan ke keranjang';b.onclick=addFruit;fruits.appendChild(b)}update()}
function addFruit(){if(done)return;chosen++;let b=document.createElement('button');b.className='fruit';b.textContent=current[0];b.title='Klik untuk keluarkan';b.onclick=()=>{if(done)return;b.remove();chosen--;update()};basket.appendChild(b);update()}
function clearBasket(){if(done)return;chosen=0;basket.innerHTML='';msg.textContent='';update()}
function check(){if(done)return;if(chosen===target){done=true;score++;stars.textContent='⭐ '+score;msg.textContent='Pas! Belanjaannya benar! 🎉';basket.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:450})}else if(chosen<target){msg.textContent='Masih kurang. Tambahkan lagi 😊'}else{msg.textContent='Terlalu banyak. Keluarkan beberapa 😊'}}
function update(){count.textContent='Jumlah: '+chosen;round.textContent='Pesanan ke-'+n;stars.textContent='⭐ '+score}newOrder();
</script><a id="homeNav" href="index.html">🏠 Taman Bermain</a></body></html>
