<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tangkap Huruf Bergerak — Belajar Bersama Bu Kalsum</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#bfeaff,#fff4ce);color:#17365d;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:30px;padding:20px;text-align:center;box-shadow:0 9px 0 #83d1a6}
h1{margin:0;color:#ee4c8a;font-size:clamp(36px,7vw,60px)}.sub{font-size:19px;font-weight:800;margin:7px}
.target{display:inline-block;margin:10px;background:#fff1b5;border-radius:20px;padding:10px 20px;font-size:24px;font-weight:900}.target b{font-size:40px;color:#dc3476}
.top{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:8px}.badge{background:#eaf8ff;border-radius:15px;padding:9px 14px;font-weight:900}
.game{position:relative;height:440px;border-radius:26px;overflow:hidden;background:linear-gradient(#dff5ff 0 72%,#bfe8a7 72%);border:4px solid #9ed9ef;margin-top:12px;touch-action:manipulation}
.cloud{position:absolute;font-size:48px;opacity:.65;pointer-events:none}.c1{left:5%;top:7%}.c2{right:6%;top:15%}
.letter{position:absolute;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:37px;font-weight:900;cursor:pointer;user-select:none;box-shadow:0 5px 0 rgba(0,0,0,.14);will-change:transform}
.msg{height:42px;font-size:25px;font-weight:900;margin:12px 0 2px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.action{border:0;border-radius:17px;padding:12px 18px;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.13)}
.new{background:#ffd65d}.sound{background:#78d8a1}footer{text-align:center;font-weight:800;margin:24px}
</style><style id="homeNavStyle">#homeNav{position:fixed;left:14px;bottom:14px;z-index:9999;background:#fff;border:3px solid #ef6b9d;border-radius:18px;padding:10px 14px;text-decoration:none;color:#c93672;font:800 15px Arial,sans-serif;box-shadow:0 4px 10px #0002}#homeNav:hover{transform:translateY(-2px)}</style></head>
<body>
<div class="wrap"><div class="card">
<h1>🎈 Tangkap Huruf!</h1>
<div class="sub">Hurufnya kabur ke mana-mana. Tangkap yang benar!</div>
<div class="target">Tangkap huruf <b id="target">m</b></div>
<div class="top"><div class="badge" id="stars">⭐ Bintang: 0</div><div class="badge" id="round">Putaran: 1</div></div>
<div class="game" id="game"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div></div>
<div class="msg" id="msg"></div>
<div class="actions"><button class="action new" onclick="newRound()">🎲 Huruf Baru</button><button class="action sound" onclick="sayTarget()">🔊 Dengarkan</button></div>
</div><footer>Belajar Bersama Bu Kalsum<br><small>Belajar hari ini, hebat setiap hari.</small></footer></div>
<script>
const letters=['m','b','t','s','l','k','p','n'], colors=['#ffd1e1','#d6efff','#fff0a9','#d8f4d5','#e9ddff','#ffd9bd'];
let target='m',stars=0,round=0,locked=false,balls=[],animId,last=0;
const game=document.getElementById('game');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeBall(ch,i){
 const d=document.createElement('div');d.className='letter';d.textContent=ch;d.style.background=colors[i%colors.length];game.appendChild(d);
 const maxX=game.clientWidth-74,maxY=game.clientHeight-74;
 const b={el:d,ch,x:Math.random()*maxX,y:Math.random()*maxY,
          vx:(Math.random()<.5?-1:1)*(55+Math.random()*65),
          vy:(Math.random()<.5?-1:1)*(35+Math.random()*55)};
 d.onclick=()=>pick(b);balls.push(b);
}
function newRound(){
 round++;locked=false;document.getElementById('msg').textContent='';
 target=letters[Math.floor(Math.random()*letters.length)];document.getElementById('target').textContent=target;
 balls.forEach(b=>b.el.remove());balls=[];
 const pool=shuffle([target,...shuffle(letters.filter(x=>x!==target)).slice(0,5)]);
 pool.forEach(makeBall);update();
}
function pick(b){
 if(locked)return;
 if(b.ch===target){
   locked=true;stars++;b.el.textContent='⭐';b.vx=0;b.vy=0;b.el.style.background='#d9f7cf';
   document.getElementById('msg').textContent='Hebat! Ketangkap! 🎉';sayTarget();update();setTimeout(newRound,1000);
 }else{
   b.vx*=-1.35;b.vy*=-1.35;b.el.style.opacity=.35;
   document.getElementById('msg').textContent='Waduh, bukan itu! Cari lagi 😄';
   setTimeout(()=>b.el.style.opacity=1,450);
 }
}
function animate(t){
 if(!last)last=t;let dt=Math.min((t-last)/1000,.03);last=t;
 const maxX=game.clientWidth-74,maxY=game.clientHeight-74;
 balls.forEach(b=>{
   b.x+=b.vx*dt;b.y+=b.vy*dt;
   if(b.x<=0){b.x=0;b.vx=Math.abs(b.vx)}
   if(b.x>=maxX){b.x=maxX;b.vx=-Math.abs(b.vx)}
   if(b.y<=0){b.y=0;b.vy=Math.abs(b.vy)}
   if(b.y>=maxY){b.y=maxY;b.vy=-Math.abs(b.vy)}
   b.el.style.transform=`translate(${b.x}px,${b.y}px)`;
 });
 animId=requestAnimationFrame(animate);
}
function sayTarget(){const u=new SpeechSynthesisUtterance('Cari huruf '+target);u.lang='id-ID';u.rate=.7;speechSynthesis.cancel();speechSynthesis.speak(u)}
function update(){document.getElementById('stars').textContent='⭐ Bintang: '+stars;document.getElementById('round').textContent='Putaran: '+round}
newRound();requestAnimationFrame(animate);
</script><a id="homeNav" href="index.html">🏠 Taman Bermain</a></body></html>
