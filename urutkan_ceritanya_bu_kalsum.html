<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urutkan Ceritanya</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#c9efff,#fff5d6);color:#17365d}.w{max-width:880px;margin:auto;padding:18px}.c{background:white;border-radius:30px;padding:20px;text-align:center;box-shadow:0 9px 0 #83d1a6}h1{margin:0;color:#ed4b89;font-size:clamp(34px,7vw,58px)}.sub{font-size:19px;font-weight:800;margin:7px}.info{font-weight:900;margin:9px}.slots,.cards{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:16px}.slot{width:190px;height:150px;border:4px dashed #78c7ed;border-radius:22px;background:#effaff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#7ca8bd}.scene{width:190px;min-height:145px;border-radius:22px;background:#fff2c7;border:4px solid #ffd369;padding:10px;cursor:grab;user-select:none;touch-action:none;box-shadow:0 5px 0 #d9b04b}.emoji{font-size:65px}.label{font-size:19px;font-weight:900;margin-top:5px}.slot.good{background:#dcf7d3;border-style:solid;border-color:#82cc76}.msg{height:43px;font-size:25px;font-weight:900}.btn{border:0;border-radius:17px;padding:12px 18px;font-size:18px;font-weight:900;background:#ffd65d;cursor:pointer;box-shadow:0 5px 0 #d9ae35}footer{text-align:center;font-weight:800;margin:22px}@media(max-width:650px){.slot,.scene{width:145px}.emoji{font-size:52px}}</style><style id="homeNavStyle">#homeNav{position:fixed;left:14px;bottom:14px;z-index:9999;background:#fff;border:3px solid #ef6b9d;border-radius:18px;padding:10px 14px;text-decoration:none;color:#c93672;font:800 15px Arial,sans-serif;box-shadow:0 4px 10px #0002}#homeNav:hover{transform:translateY(-2px)}</style></head><body><div class="w"><div class="c"><h1>🧩 Urutkan Ceritanya</h1><div class="sub">Seret gambar sesuai urutan kejadian: pertama, lalu, terakhir.</div><div class="info" id="info"></div><div class="slots"><div class="slot" data-i="0">1<br>Pertama</div><div class="slot" data-i="1">2<br>Lalu</div><div class="slot" data-i="2">3<br>Terakhir</div></div><div class="cards" id="cards"></div><div class="msg" id="msg"></div><button class="btn" onclick="next()">Cerita Berikutnya ➜</button></div><footer>Belajar Bersama Bu Kalsum<br><small>Urutan kejadian • Belajar hari ini, hebat setiap hari.</small></footer></div><script>
const stories=[
[['🌅','bangun tidur'],['🪥','sikat gigi'],['🎒','berangkat sekolah']],
[['🧼','cuci tangan'],['🍚','makan'],['🧹','rapikan meja']],
[['🌱','tanam benih'],['💧','siram tanaman'],['🌻','bunga tumbuh']],
[['📚','ambil buku'],['👀','membaca'],['📕','simpan buku']],
[['🗑️','lihat sampah'],['🧹','bersihkan'],['✨','kelas bersih']]
];
let si=0,stars=0,drag=null,placed=[false,false,false];const slots=[...document.querySelectorAll('.slot')],shuffle=a=>[...a].sort(()=>Math.random()-.5);
function load(){placed=[false,false,false];msg.textContent='';slots.forEach((s,i)=>{s.classList.remove('good');s.innerHTML=(i+1)+'<br>'+['Pertama','Lalu','Terakhir'][i]});cards.innerHTML='';shuffle(stories[si].map((x,i)=>({x,i}))).forEach(o=>{let d=document.createElement('div');d.className='scene';d.dataset.correct=o.i;d.draggable=true;d.innerHTML='<div class="emoji">'+o.x[0]+'</div><div class="label">'+o.x[1]+'</div>';d.addEventListener('dragstart',()=>drag=d);d.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')drag=d});d.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse'){let el=document.elementFromPoint(e.clientX,e.clientY);let sl=el?.closest('.slot');if(sl)place(d,sl)}});cards.appendChild(d)});update()}
slots.forEach(s=>{s.addEventListener('dragover',e=>e.preventDefault());s.addEventListener('drop',e=>{e.preventDefault();if(drag)place(drag,s)})});
function place(d,s){let i=+s.dataset.i;if(placed[i])return;if(+d.dataset.correct===i){placed[i]=true;s.innerHTML=d.innerHTML;s.classList.add('good');d.style.visibility='hidden';msg.textContent='Pas! 🌟';if(placed.every(Boolean)){stars++;msg.textContent='Hebat! Urutannya benar! 🎉';update()}}else{msg.textContent='Hmm, belum urut. Coba lagi 😊';d.animate([{transform:'rotate(-4deg)'},{transform:'rotate(4deg)'},{transform:'rotate(0)'}],{duration:280})}}
function next(){si=(si+1)%stories.length;load()}function update(){info.textContent='Cerita '+(si+1)+' dari '+stories.length+'   ⭐ '+stars}load();
</script><a id="homeNav" href="index.html">🏠 Taman Bermain</a></body></html>
