<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Labirin Angka</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(#c9efff,#fff4d1);color:#17365d}.w{max-width:900px;margin:auto;padding:18px}.c{background:#fff;border-radius:30px;padding:20px;text-align:center;box-shadow:0 9px 0 #83d1a6}h1{margin:0;color:#ed4b89;font-size:clamp(35px,7vw,58px)}.sub{font-size:19px;font-weight:800}.q{display:inline-block;background:#fff0aa;border-radius:20px;padding:10px 22px;margin:9px;font-size:38px;font-weight:900}.info{font-weight:900}.maze{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:570px;margin:15px auto;background:#9bd478;padding:10px;border-radius:24px}.cell{aspect-ratio:1;border:0;border-radius:16px;background:#fff9df;font-size:27px;font-weight:900;color:#174d78;cursor:pointer;box-shadow:0 4px 0 #76ad5f}.cell.path{background:#dff4ff}.cell.kid{background:#fff0a8;font-size:35px}.cell.goal{background:#ffd7e7;font-size:35px}.cell.wrong{animation:sh .35s;background:#ffdede}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.msg{height:42px;font-size:24px;font-weight:900;margin:10px}.btn{border:0;border-radius:17px;padding:12px 18px;font-size:18px;font-weight:900;background:#ffd65d;cursor:pointer}footer{text-align:center;font-weight:800;margin:22px}</style><style id="homeNavStyle">#homeNav{position:fixed;left:14px;bottom:14px;z-index:9999;background:#fff;border:3px solid #ef6b9d;border-radius:18px;padding:10px 14px;text-decoration:none;color:#c93672;font:800 15px Arial,sans-serif;box-shadow:0 4px 10px #0002}#homeNav:hover{transform:translateY(-2px)}</style></head><body><div class="w"><div class="c"><h1>🧩 Labirin Angka</h1><div class="sub">Bantu anak menemukan jalan menuju bintang!</div><div class="q" id="q"></div><div class="info" id="info"></div><div class="maze" id="maze"></div><div class="msg" id="msg"></div><button class="btn" onclick="restart()">↻ Mulai Lagi</button></div><footer>Belajar Bersama Bu Kalsum<br><small>Penjumlahan & pengurangan 1–20 • Belajar hari ini, hebat setiap hari.</small></footer></div><script>
let pos=0,step=0,stars=0,ans=0,a=0,b=0,op='+',done=false;const maze=document.getElementById('maze');
const route=[0,1,6,7,12,17,18,23,24];
function problem(){op=Math.random()<.5?'+':'−';if(op==='+'){ans=2+Math.floor(Math.random()*19);a=1+Math.floor(Math.random()*(ans-1));b=ans-a}else{a=3+Math.floor(Math.random()*18);b=1+Math.floor(Math.random()*a);ans=a-b}q.textContent=a+' '+op+' '+b+' = ?'}
function render(){maze.innerHTML='';let correctNext=route[Math.min(step+1,route.length-1)];for(let i=0;i<25;i++){let c=document.createElement('button');c.className='cell';if(route.includes(i))c.classList.add('path');if(i===route[step]){c.classList.add('kid');c.textContent='🧒'}else if(i===24){c.classList.add('goal');c.textContent='⭐'}else{let n=(i===correctNext)?ans:Math.max(0,Math.min(20,ans+((i*3+step)%7)-3));if(n===ans&&i!==correctNext)n=(ans+2)%21;c.textContent=n;c.onclick=()=>pick(i,n,c)}maze.appendChild(c)}info.textContent='Langkah '+(step+1)+' dari '+(route.length-1)+'   ⭐ '+stars}
}
function pick(i,n,c){if(done)return;let next=route[step+1];if(i===next&&n===ans){stars++;step++;msg.textContent='Benar! Maju satu langkah! 🌟';if(step===route.length-1){done=true;render();msg.textContent='Hore! Berhasil keluar dari labirin! 🏆'}else{problem();render()}}else{c.classList.remove('wrong');void c.offsetWidth;c.classList.add('wrong');msg.textContent='Jalan itu belum tepat. Coba lagi 😊'}}
function restart(){step=0;stars=0;done=false;msg.textContent='';problem();render()}restart();
</script><a id="homeNav" href="index.html">🏠 Taman Bermain</a></body></html>
